name: Build and Publish Telegram BLORG Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Upstream Check
        run: |
          git remote add upstream https://github.com/DrKLO/Telegram.git || true
          git fetch upstream
          git merge upstream/master --no-edit || {
            echo "Error: Conflicts found in the cloud! Please resolve them locally on your PC."
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore File
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Inject Credentials to local.properties
        run: |
          echo "telegram.app_id=${{ secrets.TELEGRAM_APP_ID }}" >> local.properties
          echo "telegram.app_hash=\"${{ secrets.TELEGRAM_APP_HASH }}\"" >> local.properties
          echo "keystore.file=${{ github.workspace }}/release.jks" >> local.properties
          echo "keystore.password=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "key.alias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "key.password=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Build Standalone APK
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
          fi
          if [ -f TMessagesProj/gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' TMessagesProj/gradle.properties
          fi
          
          ./gradlew clean assembleStandalone

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_artifacts
          
          echo "Scanning workspace for compiled APKs..."
          APK_PATH=$(find . -not -path '*/.*' -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found anywhere in the workspace!"
            ls -R
            exit 1
          fi
          
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release_artifacts/telegram_blorg.apk
          
      - name: Generate Automatic Changelog
        id: changelog
        run: |
          echo "CHANGELOG_TEXT<<EOF" >> $GITHUB_ENV
          echo "### What's new in this build:" >> $GITHUB_ENV
          
          git log -1 --pretty=format:"%B" >> $GITHUB_ENV
          
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate Version Tag
        id: tag
        run: echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "BLORG Update ${{ steps.tag.outputs.release_tag }}"
          body: |
            ${{ env.CHANGELOG_TEXT }}
            
            ---
            *This build was automatically generated by a BLORG CI/CD bot.*
          draft: false
          prerelease: false
          files: release_artifacts/telegram_blorg.apk